<!DOCTYPE html>
<html>
  <head>
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <title>Gorge Park Slump 360° View</title>
    
  </head>
  <body>
  <h1>Gorge Park Slump 360° View</h1>
      <script>
        window.addEventListener("wheel", (event) => {
          const delta = event.wheelDelta / 120 / 10;
          var mycam = document.getElementById("cam").getAttribute("camera");
          var finalZoom =
            document.getElementById("cam").getAttribute("camera").zoom + delta;
      
          // limiting the zoom
          if (finalZoom < 0.5) finalZoom = 0.5;
          if (finalZoom > 2) finalZoom = 2;
          mycam.zoom = finalZoom;
      
          document.getElementById("cam").setAttribute("camera", mycam);
        });
      </script>
      <a-scene>
        <a-entity
          id="cam"
          camera="zoom: 1"
          look-controls="reverseMouseDrag: true"
        ></a-entity>
        <a-assets>
          <img id="skyTexture" crossorigin="anonymous"src="https://wendyanthony.github.io/WorldBuilding/IMG_20261103_134408_00_561.jpg" />
        </a-assets>
        <a-sky src="#skyTexture" rotation="0 -90 -55"></a-sky>
      </a-scene>
  </body>
</html>
