<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>360° Nature Stroll</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script>
    const ENABLE_COORD_HELPER = true;
    let isMuted = false;
    let activeAudioId = 'rain-audio';
    let lookMode = 'touch';
    const activeFadeFrames = {}; // Tracks and cancels overlapping fade animations

    // 1. Draw crisp text onto an HTML5 Canvas texture
    AFRAME.registerComponent('sign-label', {
      schema: {
        text: { type: 'string', default: '' },
        bgColor: { type: 'string', default: '#1f3326' },
        borderColor: { type: 'string', default: '#8fb399' },
        textColor: { type: 'string', default: '#f4f7f2' },
        fontSize: { type: 'number', default: 44 },
        width: { type: 'number', default: 1024 },
        height: { type: 'number', default: 256 }
      },
      init: function () { this.renderCanvas(); },
      update: function () { this.renderCanvas(); },
      renderCanvas: function () {
        const d = this.data;
        const canvas = document.createElement('canvas');
        canvas.width = d.width;
        canvas.height = d.height;
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = d.bgColor;
        ctx.fillRect(0, 0, d.width, d.height);

        if (d.borderColor) {
          ctx.strokeStyle = d.borderColor;
          ctx.lineWidth = 10;
          ctx.strokeRect(5, 5, d.width - 10, d.height - 10);
        }

        ctx.fillStyle = d.textColor;
        ctx.font = `bold ${d.fontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        const lines = d.text.split('\n');
        const lineHeight = d.fontSize * 1.3;
        const startY = (d.height / 2) - ((lines.length - 1) * lineHeight) / 2;

        lines.forEach((line, i) => {
          ctx.fillText(line.trim(), d.width / 2, startY + i * lineHeight);
        });

        const texture = new THREE.CanvasTexture(canvas);
        texture.needsUpdate = true;

        const applyTexture = () => {
          const mesh = this.el.getObject3D('mesh');
          if (mesh) {
            mesh.material.map = texture;
            mesh.material.color.set('#ffffff');
            mesh.material.needsUpdate = true;
          }
        };

        if (this.el.getObject3D('mesh')) {
          applyTexture();
        } else {
          this.el.addEventListener('object3dset', applyTexture, { once: true });
        }
      }
    });

    // 2. Reliable Audio Fade (Cancels prior animations + works on iPad where .volume is read-only)
    function fadeHtmlAudio(audioId, targetVol, duration = 1000) {
      const audioEl = document.getElementById(audioId);
      if (!audioEl) return;

      // Cancel any in-progress fade on this track so fades never fight each other
      if (activeFadeFrames[audioId]) {
        cancelAnimationFrame(activeFadeFrames[audioId]);
        delete activeFadeFrames[audioId];
      }

      if (targetVol > 0) {
        audioEl.muted = false;
        if (audioEl.paused) {
          audioEl.play().catch(err => console.warn('Audio play blocked or file missing:', err));
        }
      }

      const startVol = audioEl.volume;
      const startTime = performance.now();

      function step(now) {
        const progress = Math.min((now - startTime) / duration, 1);
        const nextVol = Math.max(0, Math.min(1, startVol + (targetVol - startVol) * progress));
        try {
          audioEl.volume = nextVol;
        } catch (e) {
          // iPadOS Safari keeps HTMLMediaElement.volume read-only; fallback to .muted
        }

        if (progress < 1) {
          activeFadeFrames[audioId] = requestAnimationFrame(step);
        } else {
          delete activeFadeFrames[audioId];
          if (targetVol === 0) {
            audioEl.muted = true;
            audioEl.pause();
          }
        }
      }
      activeFadeFrames[audioId] = requestAnimationFrame(step);
    }

    // 3. Immediate Dedicated Audio Off / On Button (Guaranteed to silence audio right away on Desktop & iPad)
    function toggleMute() {
      isMuted = !isMuted;
      const btn = document.getElementById('mute-btn');
      btn.textContent = isMuted ? 'Turn Audio On' : 'Turn Audio Off';
      btn.classList.toggle('is-muted', isMuted);

      if (isMuted) {
        // Cancel any running fade-in and immediately mute + pause every audio track
        document.querySelectorAll('.ambient-audio').forEach(a => {
          if (activeFadeFrames[a.id]) {
            cancelAnimationFrame(activeFadeFrames[a.id]);
            delete activeFadeFrames[a.id];
          }
          a.muted = true;
          a.pause();
        });
      } else if (activeAudioId) {
        const currentTrack = document.getElementById(activeAudioId);
        if (currentTrack) {
          currentTrack.muted = false;
          currentTrack.volume = 0.05;
          fadeHtmlAudio(activeAudioId, 0.45, 700);
        }
      }
    }

    // 4. iPad / Tablet Look Mode Switcher: Touch Drag vs. VR / Tilt Motion
    async function setLookMode(mode) {
      const cam = document.getElementById('main-cam');
      const modeBtn = document.getElementById('mode-btn');
      const scene = document.querySelector('a-scene');

      if (mode === 'vr') {
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
          try {
            const response = await DeviceOrientationEvent.requestPermission();
            if (response !== 'granted') {
              alert('Motion permission was declined. Staying in Touch Pan mode.');
              mode = 'touch';
            }
          } catch (e) {
            console.warn('Motion permission error:', e);
          }
        }
      }

      lookMode = mode;
      if (mode === 'vr') {
        cam.setAttribute('look-controls', 'magicWindowTrackingEnabled: true; touchEnabled: true; reverseMouseDrag: false');
        modeBtn.textContent = 'Mode: VR / Motion';
        if (scene && scene.enterVR && navigator.xr) {
          scene.enterVR().catch(() => {});
        }
      } else {
        cam.setAttribute('look-controls', 'magicWindowTrackingEnabled: false; touchEnabled: true; reverseMouseDrag: true');
        modeBtn.textContent = 'Mode: Touch Pan';
        if (scene && scene.is('vr-mode') && scene.exitVR) {
          scene.exitVR();
        }
      }
    }

    function toggleLookMode() {
      setLookMode(lookMode === 'touch' ? 'vr' : 'touch');
    }

    // 5. Begin Stroll
    async function startStroll(selectedMode = 'touch', startWithAudio = true) {
      await setLookMode(selectedMode);

      document.getElementById('welcome-overlay').style.display = 'none';
      document.getElementById('top-controls').style.display = 'flex';
      document.getElementById('location-banner').style.display = 'block';

      if (startWithAudio) {
        isMuted = false;
        const firstTrack = document.getElementById(activeAudioId);
        if (firstTrack) {
          firstTrack.muted = false;
          firstTrack.volume = 0.05;
        }
        fadeHtmlAudio(activeAudioId, 0.45, 1200);
      } else {
        isMuted = true;
        document.querySelectorAll('.ambient-audio').forEach(a => {
          a.muted = true;
          a.pause();
        });
        const btn = document.getElementById('mute-btn');
        btn.textContent = 'Turn Audio On';
        btn.classList.add('is-muted');
      }
    }

    // 6. Subtle Fade Update for Top-Left Location Banner
    function updateLocationBanner(newTitle) {
      if (!newTitle) return;
      const banner = document.getElementById('location-banner');
      const titleEl = document.getElementById('location-title');
      banner.classList.add('banner-fading');
      setTimeout(() => {
        titleEl.textContent = newTitle;
        banner.classList.remove('banner-fading');
      }, 450);
    }

    // 7. Switch 360° viewpoints + update banner + cross-fade audio
    AFRAME.registerComponent('spot-link', {
      schema: {
        targetSky: { type: 'string' },
        targetGroup: { type: 'string' },
        targetAudio: { type: 'string' },
        spotTitle: { type: 'string', default: '' },
        skyRotation: { type: 'string', default: '0 0 0' }
      },
      init: function () {
        const el = this.el;
        const data = this.data;

        el.addEventListener('mouseenter', () => el.setAttribute('scale', '1.08 1.08 1.08'));
        el.addEventListener('mouseleave', () => el.setAttribute('scale', '1 1 1'));

        el.addEventListener('click', (evt) => {
          if (evt.detail.mouseEvent && evt.detail.mouseEvent.shiftKey) return;

          const sky = document.querySelector('#main-sky');
          const fader = document.querySelector('#fade-sphere');

          if (data.targetAudio) activeAudioId = data.targetAudio;

          document.querySelectorAll('.ambient-audio').forEach(a => {
            if (a.id !== activeAudioId) fadeHtmlAudio(a.id, 0, 900);
          });

          if (!isMuted && activeAudioId) {
            fadeHtmlAudio(activeAudioId, 0.45, 1200);
          }

          if (data.spotTitle) {
            updateLocationBanner(data.spotTitle);
          }

          fader.emit('fadeOut');
          setTimeout(() => {
            sky.setAttribute('src', data.targetSky);
            sky.setAttribute('rotation', data.skyRotation);

            const marker = document.querySelector('#preview-marker');
            if (marker) marker.setAttribute('visible', false);

            document.querySelectorAll('.spot-group').forEach(group => {
              group.setAttribute('visible', false);
              group.querySelectorAll('.clickable').forEach(c => c.classList.remove('active-ray'));
            });

            const nextGroup = document.querySelector(data.targetGroup);
            if (nextGroup) {
              nextGroup.setAttribute('visible', true);
              nextGroup.querySelectorAll('.clickable').forEach(c => c.classList.add('active-ray'));
            }

            fader.emit('fadeIn');
          }, 650);
        });
      }
    });

    // 8. Toggle Garden Note Card
    AFRAME.registerComponent('info-note', {
      schema: { noteId: { type: 'string' } },
      init: function () {
        this.el.addEventListener('mouseenter', () => this.el.setAttribute('scale', '1.05 1.05 1.05'));
        this.el.addEventListener('mouseleave', () => this.el.setAttribute('scale', '1 1 1'));

        this.el.addEventListener('click', (evt) => {
          if (evt.detail.mouseEvent && evt.detail.mouseEvent.shiftKey) return;
          const panel = document.querySelector(this.data.noteId);
          if (panel) panel.setAttribute('visible', !panel.getAttribute('visible'));
        });
      }
    });

    // 9. Open a standard (non-360°) close-up photo in a clean lightbox
    AFRAME.registerComponent('photo-popup', {
      schema: {
        imgSrc: { type: 'string' },
        caption: { type: 'string', default: '' }
      },
      init: function () {
        this.el.addEventListener('mouseenter', () => this.el.setAttribute('scale', '1.05 1.05 1.05'));
        this.el.addEventListener('mouseleave', () => this.el.setAttribute('scale', '1 1 1'));

        this.el.addEventListener('click', (evt) => {
          if (evt.detail.mouseEvent && evt.detail.mouseEvent.shiftKey) return;
          document.getElementById('lightbox-img').src = this.data.imgSrc;
          document.getElementById('lightbox-caption').textContent = this.data.caption;
          document.getElementById('photo-lightbox').style.display = 'flex';
        });
      }
    });

    function closePhotoLightbox() {
      document.getElementById('photo-lightbox').style.display = 'none';
    }

    // 10. Shift + Click Coordinate Helper
    AFRAME.registerComponent('coord-picker', {
      init: function () {
        if (!ENABLE_COORD_HELPER) return;
        const marker = document.querySelector('#preview-marker');
        const hud = document.querySelector('#coord-hud');
        const readout = document.querySelector('#coord-readout');

        this.el.addEventListener('click', (evt) => {
          if (!evt.detail.mouseEvent || !evt.detail.mouseEvent.shiftKey) return;

          const pt = evt.detail.intersection.point;
          const x = pt.x.toFixed(2);
          const y = pt.y.toFixed(2);
          const z = pt.z.toFixed(2);

          marker.setAttribute('position', `${x} ${y} ${z}`);
          marker.setAttribute('visible', true);
          marker.object3D.lookAt(0, 1.6, 0);

          const rot = marker.object3D.rotation;
          const rx = THREE.MathUtils.radToDeg(rot.x).toFixed(1);
          const ry = THREE.MathUtils.radToDeg(rot.y).toFixed(1);
          const rz = THREE.MathUtils.radToDeg(rot.z).toFixed(1);

          const snippet = `position="${x} ${y} ${z}" rotation="${rx} ${ry} ${rz}"`;

          hud.style.display = 'block';
          readout.textContent = `Copied: ${snippet}`;
          if (navigator.clipboard) navigator.clipboard.writeText(snippet);
        });
      }
    });
  </script>
  <style>
    /* Welcome Overlay */
    #welcome-overlay {
      position: fixed; inset: 0; background: rgba(20, 28, 23, 0.9);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #f4f7f2; font-family: Georgia, serif; z-index: 999; text-align: center; padding: 20px;
    }
    #welcome-overlay h2 { margin-bottom: 8px; font-weight: normal; }
    #welcome-overlay p { max-width: 440px; color: #c9d8cd; line-height: 1.5; margin-bottom: 20px; }
    .start-buttons {
      display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; max-width: 480px;
    }
    .start-buttons button {
      padding: 12px 22px; font-size: 15px; cursor: pointer;
      background: #2f4f3a; color: #f4f7f2; border: 1px solid #8fb399; border-radius: 6px;
      font-family: Georgia, serif; transition: background 0.2s ease;
    }
    .start-buttons button:hover { background: #3b6349; }
    .start-buttons button.secondary-btn {
      background: rgba(31, 51, 38, 0.65);
    }

    /* Subtle Top-Left Location Banner with Smooth Fade Transition */
    #location-banner {
      position: fixed; top: 16px; left: 16px; z-index: 998; display: none;
      background: rgba(20, 28, 23, 0.65); color: #f4f7f2;
      border-left: 3px solid #8fb399; border-radius: 4px;
      padding: 8px 14px; font-family: Georgia, serif;
      backdrop-filter: blur(4px); pointer-events: none;
      opacity: 1;
      transition: opacity 0.45s ease-in-out;
    }
    #location-banner.banner-fading {
      opacity: 0;
    }
    #location-banner small {
      display: block; font-size: 10px; text-transform: uppercase;
      letter-spacing: 1px; color: #b7cbbd; margin-bottom: 2px;
    }
    #location-title { font-size: 15px; }

    /* Top-Right Controls: Touch/VR Mode Toggle + Turn Audio Off Button */
    #top-controls {
      position: fixed; top: 16px; right: 16px; z-index: 998;
      display: none; gap: 8px; flex-wrap: wrap; justify-content: flex-end;
    }
    .hud-pill-btn {
      background: rgba(20, 28, 23, 0.7); color: #f4f7f2;
      border: 1px solid rgba(143, 179, 153, 0.55); border-radius: 20px;
      padding: 8px 14px; font-family: Georgia, serif; font-size: 13px;
      cursor: pointer; backdrop-filter: blur(4px);
      transition: background 0.2s ease, opacity 0.2s ease;
      touch-action: manipulation;
    }
    .hud-pill-btn:hover { background: rgba(31, 51, 38, 0.92); }
    .hud-pill-btn.is-muted { opacity: 0.75; border-color: rgba(180, 180, 180, 0.4); }

    /* Non-360° Photo Lightbox Modal */
    #photo-lightbox {
      position: fixed; inset: 0; background: rgba(15, 22, 18, 0.88);
      display: none; flex-direction: column; align-items: center; justify-content: center;
      z-index: 1000; padding: 24px; text-align: center;
    }
    #photo-lightbox img {
      max-width: 88vw; max-height: 72vh; border-radius: 6px;
      border: 2px solid #8fb399; box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    }
    #lightbox-caption {
      color: #f4f7f2; font-family: Georgia, serif; font-size: 16px;
      margin-top: 14px; max-width: 600px; line-height: 1.4;
    }
    #photo-lightbox button {
      margin-top: 14px; padding: 8px 20px; background: #2f4f3a; color: #f4f7f2;
      border: 1px solid #8fb399; border-radius: 20px; font-family: Georgia, serif; cursor: pointer;
    }

    /* Coordinate Helper HUD */
    #coord-hud {
      position: fixed; bottom: 16px; left: 16px; z-index: 997; display: none;
      background: rgba(20, 28, 23, 0.9); color: #f4f7f2;
      font-family: monospace; font-size: 13px; padding: 10px 14px;
      border: 1px solid #8fb399; border-radius: 6px; max-width: 90vw;
    }
    #coord-hud small { display: block; color: #b7cbbd; margin-bottom: 4px; font-family: sans-serif; }
  </style>
</head>
<body>

  <!-- Welcome Overlay with iPad Touch vs. VR Choice -->
  <div id="welcome-overlay">
    <h2>Winter Garden &amp; Woodland Stroll</h2>
    <p>Choose how you would like to look around on your device. You can switch modes or turn audio off anytime in the top-right corner.</p>
    <div class="start-buttons">
      <button onclick="startStroll('touch', true)">Start with Touch Pan</button>
      <button class="secondary-btn" onclick="startStroll('vr', true)">Start with VR / Motion</button>
      <button class="secondary-btn" onclick="startStroll('touch', false)">Start Quietly (Audio Off)</button>
    </div>
  </div>

  <!-- Subtle Top-Left Location Banner (Fades smoothly on spot change) -->
  <div id="location-banner">
    <small>Current Spot</small>
    <div id="location-title">Garden Bench</div>
  </div>

  <!-- Top-Right Control Pills: iPad Mode Switcher + Dedicated Turn Audio Off Button -->
  <div id="top-controls">
    <button id="mode-btn" class="hud-pill-btn" onclick="toggleLookMode()" aria-label="Switch between Touch Pan and VR Motion">
      Mode: Touch Pan
    </button>
    <button id="mute-btn" class="hud-pill-btn" onclick="toggleMute()" aria-label="Turn ambient audio off or on">
      Turn Audio Off
    </button>
  </div>

  <!-- Lightbox Modal for Non-360° Close-Up Photos -->
  <div id="photo-lightbox" onclick="closePhotoLightbox()">
    <img id="lightbox-img" src="" alt="Close-up nature view" onclick="event.stopPropagation()">
    <div id="lightbox-caption" onclick="event.stopPropagation()"></div>
    <button onclick="closePhotoLightbox()">Return to 360° View</button>
  </div>

  <!-- Coordinate Helper HUD -->
  <div id="coord-hud">
    <small>Coordinates copied to clipboard (Shift + Click any spot to update):</small>
    <div id="coord-readout"></div>
  </div>

  <a-scene cursor="rayOrigin: mouse" raycaster="objects: .active-ray, .picker-dome" vr-mode-ui="enabled: false">

  <!-- assets -->
    <a-assets>
      <img id="bench-img" src="IMG_20261103_134408_00_561.jpg" crossorigin="anonymous">
      <img id="oak-img" src="IMG_20261127_103330_796.JPG" crossorigin="anonymous">
      <audio id="rain-audio" src="garden-rain.mp3" preload="auto" crossorigin="anonymous"></audio>
      <audio id="birds-audio" src="oak-birds.mp3" preload="auto" crossorigin="anonymous"></audio>
    </a-assets>

    <a-sky id="main-sky" src="#bench-img" rotation="0 -90 0"></a-sky>

    <a-sphere class="picker-dome" position="0 1.6 0" radius="4.5" material="side: back; transparent: true; opacity: 0" coord-picker></a-sphere>

    <a-plane id="preview-marker" visible="false" width="2.2" height="0.55" material="shader: flat"
             sign-label="text: New Spot Marker; bgColor: #4a3728; borderColor: #d9c3b0; textColor: #f4f7f2"></a-plane>

    <a-entity id="rig" position="0 1.6 0">
      <a-camera id="main-cam" look-controls="magicWindowTrackingEnabled: false; touchEnabled: true; reverseMouseDrag: true">
        <a-sphere id="fade-sphere" radius="0.5" material="color: #141c17; shader: flat; side: back; transparent: true; opacity: 0"
                  animation__out="property: material.opacity; from: 0; to: 1; dur: 600; startEvents: fadeOut"
                  animation__in="property: material.opacity; from: 1; to: 0; dur: 600; startEvents: fadeIn">
        </a-sphere>
      </a-camera>
    </a-entity>

    <!-- VIEWPOINT 1: GARDEN BENCH -->
    <a-entity id="bench-spots" class="spot-group" visible="true">
      <a-plane position="0 1.5 -4" rotation="0 0 0" width="2.4" height="0.65" material="shader: flat"
               class="clickable active-ray"
               sign-label="text: Walk to the Garry Oak ->; bgColor: #1f3326; borderColor: #8fb399; textColor: #f4f7f2"
               spot-link="targetSky: #oak-img; targetGroup: #oak-spots; targetAudio: birds-audio; spotTitle: Under the Garry Oak; skyRotation: 0 45 0">
      </a-plane>

      <a-plane position="-2.8 1.5 -2.8" rotation="0 45 0" width="2.1" height="0.52" material="shader: flat"
               class="clickable active-ray"
               sign-label="text: [View Close-Up Photo]; bgColor: #2e3d47; borderColor: #9eb8c7; textColor: #f4f7f2; fontSize: 38"
               photo-popup="imgSrc: DSCN8397-slump-hightide-erosion.jpg; caption: Slump being disolved by High King Timde on Gorge.">
      </a-plane>

      <a-entity position="3.1 1.7 -2.5" rotation="0 -50 0">
        <a-plane width="1.75" height="0.48" material="shader: flat"
                 class="clickable active-ray"
                 sign-label="text: [+] Garden Note; bgColor: #3b4d3e; borderColor: #8fb399; textColor: #ffffff; fontSize: 40"
                 info-note="noteId: #bench-note-card">
        </a-plane>
        <a-plane id="bench-note-card" position="0 -0.9 0" visible="false" width="2.7" height="1.2" material="shader: flat"
                 sign-label="text: Winter Dormancy:
Licorice ferns stay bright green
on damp mossy bark all winter.; bgColor: #f7f5ee; borderColor: #3b4d3e; textColor: #222b24; fontSize: 36; width: 1024; height: 455">
        </a-plane>
      </a-entity>
    </a-entity>

    <!-- VIEWPOINT 2: UNDER THE GARRY OAK -->
    <a-entity id="oak-spots" class="spot-group" visible="false">
      <a-plane position="0 1.5 -4" rotation="0 0 0" width="2.4" height="0.65" material="shader: flat"
               class="clickable"
               sign-label="text: <- Return to Bench; bgColor: #1f3326; borderColor: #8fb399; textColor: #f4f7f2"
               spot-link="targetSky: #bench-img; targetGroup: #bench-spots; targetAudio: rain-audio; spotTitle: Garden Bench; skyRotation: 0 -90 0">
      </a-plane>
    </a-entity>

  </a-scene>
</body>
</html>
