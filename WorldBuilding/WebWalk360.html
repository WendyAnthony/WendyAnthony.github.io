<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>360° Nature Stroll</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script>
    const ENABLE_COORD_HELPER = true;
    let isMuted = false;
    let activeAudioId = 'rain-audio';

    // 1. Draw crisp text onto an HTML5 Canvas and apply it as a texture (Zero external font dependencies)
    AFRAME.registerComponent('sign-label', {
      schema: {
        text: { type: 'string', default: '' },
        bgColor: { type: 'string', default: '#1f3326' },
        borderColor: { type: 'string', default: '#8fb399' },
        textColor: { type: 'string', default: '#f4f7f2' },
        fontSize: { type: 'number', default: 44 },
        width: { type: 'number', default: 1024 },
        height: { type: 'number', default: 256 }
      },
      init: function () {
        this.renderCanvas();
      },
      update: function () {
        this.renderCanvas();
      },
      renderCanvas: function () {
        const d = this.data;
        const canvas = document.createElement('canvas');
        canvas.width = d.width;
        canvas.height = d.height;
        const ctx = canvas.getContext('2d');

        // Background
        ctx.fillStyle = d.bgColor;
        ctx.fillRect(0, 0, d.width, d.height);

        // Border
        if (d.borderColor) {
          ctx.strokeStyle = d.borderColor;
          ctx.lineWidth = 10;
          ctx.strokeRect(5, 5, d.width - 10, d.height - 10);
        }

        // Typography using system sans-serif / Georgia
        ctx.fillStyle = d.textColor;
        ctx.font = `bold ${d.fontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        // Support multi-line text separated by "\n"
        const lines = d.text.split('\n');
        const lineHeight = d.fontSize * 1.3;
        const startY = (d.height / 2) - ((lines.length - 1) * lineHeight) / 2;

        lines.forEach((line, i) => {
          ctx.fillText(line.trim(), d.width / 2, startY + i * lineHeight);
        });

        const texture = new THREE.CanvasTexture(canvas);
        texture.needsUpdate = true;

        const applyTexture = () => {
          const mesh = this.el.getObject3D('mesh');
          if (mesh) {
            mesh.material.map = texture;
            mesh.material.color.set('#ffffff');
            mesh.material.needsUpdate = true;
          }
        };

        if (this.el.getObject3D('mesh')) {
          applyTexture();
        } else {
          this.el.addEventListener('object3dset', applyTexture, { once: true });
        }
      }
    });

    // 2. Reliable HTML5 Audio Cross-Fade
    function fadeHtmlAudio(audioId, targetVol, duration = 1200) {
      const audioEl = document.getElementById(audioId);
      if (!audioEl) return;

      const startVol = audioEl.volume;
      const startTime = performance.now();

      if (targetVol > 0 && audioEl.paused) {
        audioEl.play().catch(err => console.warn('Audio play blocked or file missing:', err));
      }

      function step(now) {
        const progress = Math.min((now - startTime) / duration, 1);
        audioEl.volume = Math.max(0, Math.min(1, startVol + (targetVol - startVol) * progress));

        if (progress < 1) {
          requestAnimationFrame(step);
        } else if (targetVol === 0) {
          audioEl.pause();
        }
      }
      requestAnimationFrame(step);
    }

    // 3. Corner Mute / Unmute Toggle
    function toggleMute() {
      isMuted = !isMuted;
      const btn = document.getElementById('mute-btn');
      btn.textContent = isMuted ? 'Sound: Off' : 'Sound: On';
      btn.style.opacity = isMuted ? '0.65' : '1';

      if (isMuted) {
        document.querySelectorAll('.ambient-audio').forEach(a => fadeHtmlAudio(a.id, 0, 500));
      } else if (activeAudioId) {
        fadeHtmlAudio(activeAudioId, 0.45, 800);
      }
    }

    // 4. Begin Stroll
    function startStroll() {
      document.getElementById('welcome-overlay').style.display = 'none';
      document.getElementById('mute-btn').style.display = 'block';
      fadeHtmlAudio(activeAudioId, 0.45, 1500);
    }

    // 5. Switch viewpoints + cross-fade audio
    AFRAME.registerComponent('spot-link', {
      schema: {
        targetSky: { type: 'string' },
        targetGroup: { type: 'string' },
        targetAudio: { type: 'string' },
        skyRotation: { type: 'string', default: '0 0 0' }
      },
      init: function () {
        const el = this.el;
        const data = this.data;

        el.addEventListener('mouseenter', () => el.setAttribute('scale', '1.08 1.08 1.08'));
        el.addEventListener('mouseleave', () => el.setAttribute('scale', '1 1 1'));

        el.addEventListener('click', (evt) => {
          if (evt.detail.mouseEvent && evt.detail.mouseEvent.shiftKey) return;

          const sky = document.querySelector('#main-sky');
          const fader = document.querySelector('#fade-sphere');

          if (data.targetAudio) activeAudioId = data.targetAudio;

          document.querySelectorAll('.ambient-audio').forEach(a => {
            if (a.id !== activeAudioId) fadeHtmlAudio(a.id, 0, 1000);
          });

          if (!isMuted && activeAudioId) {
            fadeHtmlAudio(activeAudioId, 0.45, 1500);
          }

          fader.emit('fadeOut');
          setTimeout(() => {
            sky.setAttribute('src', data.targetSky);
            sky.setAttribute('rotation', data.skyRotation);

            const marker = document.querySelector('#preview-marker');
            if (marker) marker.setAttribute('visible', false);

            document.querySelectorAll('.spot-group').forEach(group => {
              group.setAttribute('visible', false);
              group.querySelectorAll('.clickable').forEach(c => c.classList.remove('active-ray'));
            });

            const nextGroup = document.querySelector(data.targetGroup);
            if (nextGroup) {
              nextGroup.setAttribute('visible', true);
              nextGroup.querySelectorAll('.clickable').forEach(c => c.classList.add('active-ray'));
            }

            fader.emit('fadeIn');
          }, 650);
        });
      }
    });

    // 6. Toggle Garden Note Card
    AFRAME.registerComponent('info-note', {
      schema: { noteId: { type: 'string' } },
      init: function () {
        this.el.addEventListener('mouseenter', () => this.el.setAttribute('scale', '1.05 1.05 1.05'));
        this.el.addEventListener('mouseleave', () => this.el.setAttribute('scale', '1 1 1'));

        this.el.addEventListener('click', (evt) => {
          if (evt.detail.mouseEvent && evt.detail.mouseEvent.shiftKey) return;
          const panel = document.querySelector(this.data.noteId);
          if (panel) panel.setAttribute('visible', !panel.getAttribute('visible'));
        });
      }
    });

    // 7. Shift + Click Coordinate Helper
    AFRAME.registerComponent('coord-picker', {
      init: function () {
        if (!ENABLE_COORD_HELPER) return;
        const marker = document.querySelector('#preview-marker');
        const hud = document.querySelector('#coord-hud');
        const readout = document.querySelector('#coord-readout');

        this.el.addEventListener('click', (evt) => {
          if (!evt.detail.mouseEvent || !evt.detail.mouseEvent.shiftKey) return;

          const pt = evt.detail.intersection.point;
          const x = pt.x.toFixed(2);
          const y = pt.y.toFixed(2);
          const z = pt.z.toFixed(2);

          marker.setAttribute('position', `${x} ${y} ${z}`);
          marker.setAttribute('visible', true);
          marker.object3D.lookAt(0, 1.6, 0);

          const rot = marker.object3D.rotation;
          const rx = THREE.MathUtils.radToDeg(rot.x).toFixed(1);
          const ry = THREE.MathUtils.radToDeg(rot.y).toFixed(1);
          const rz = THREE.MathUtils.radToDeg(rot.z).toFixed(1);

          const snippet = `position="${x} ${y} ${z}" rotation="${rx} ${ry} ${rz}"`;

          hud.style.display = 'block';
          readout.textContent = `Copied: ${snippet}`;
          if (navigator.clipboard) navigator.clipboard.writeText(snippet);
        });
      }
    });
  </script>
  <style>
    #welcome-overlay {
      position: fixed; inset: 0; background: rgba(20, 28, 23, 0.88);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #f4f7f2; font-family: Georgia, serif; z-index: 999; text-align: center; padding: 20px;
    }
    #welcome-overlay h2 { margin-bottom: 8px; font-weight: normal; }
    #welcome-overlay p { max-width: 420px; color: #c9d8cd; line-height: 1.5; }
    #welcome-overlay button {
      margin-top: 18px; padding: 12px 28px; font-size: 16px; cursor: pointer;
      background: #2f4f3a; color: #f4f7f2; border: 1px solid #8fb399; border-radius: 6px;
      font-family: Georgia, serif;
    }
    #mute-btn {
      position: fixed; top: 16px; right: 16px; z-index: 998; display: none;
      background: rgba(20, 28, 23, 0.65); color: #f4f7f2;
      border: 1px solid rgba(143, 179, 153, 0.5); border-radius: 20px;
      padding: 8px 14px; font-family: Georgia, serif; font-size: 13px; cursor: pointer;
    }
    #coord-hud {
      position: fixed; bottom: 16px; left: 16px; z-index: 997; display: none;
      background: rgba(20, 28, 23, 0.9); color: #f4f7f2;
      font-family: monospace; font-size: 13px; padding: 10px 14px;
      border: 1px solid #8fb399; border-radius: 6px; max-width: 90vw;
    }
    #coord-hud small { display: block; color: #b7cbbd; margin-bottom: 4px; font-family: sans-serif; }
  </style>
</head>
<body>

  <div id="welcome-overlay">
    <h2>Winter Garden &amp; Woodland Stroll</h2>
    <p>Take a slow look around. Click signposts to move between spots, or open field notes along the path.</p>
    <button onclick="startStroll()">Begin Stroll (Sound On)</button>
  </div>

  <button id="mute-btn" onclick="toggleMute()" aria-label="Toggle ambient audio">Sound: On</button>

  <div id="coord-hud">
    <small>Coordinates copied to clipboard (Shift + Click any spot to update):</small>
    <div id="coord-readout"></div>
  </div>

  <a-scene cursor="rayOrigin: mouse" raycaster="objects: .active-ray, .picker-dome">

    <a-assets>
      <img id="bench-img" src="IMG_20261103_134408_00_561.jpg" crossorigin="anonymous">
      <img id="oak-img" src="IMG_20261127_103330_796.JPG" crossorigin="anonymous">
      <audio id="rain-audio" src="garden-rain.mp3" preload="auto" crossorigin="anonymous"></audio>
      <audio id="birds-audio" src="oak-birds.mp3" preload="auto" crossorigin="anonymous"></audio>
    </a-assets>

    <a-sky id="main-sky" src="#bench-img" rotation="0 -90 0"></a-sky>

    <a-sphere class="picker-dome" position="0 1.6 0" radius="4.5" material="side: back; transparent: true; opacity: 0" coord-picker></a-sphere>

    <!-- Preview Marker -->
    <a-plane id="preview-marker" visible="false" width="2.2" height="0.55" material="shader: flat"
             sign-label="text: New Spot Marker; bgColor: #4a3728; borderColor: #d9c3b0; textColor: #f4f7f2"></a-plane>

    <a-entity id="rig" position="0 1.6 0">
      <a-camera look-controls="reverseMouseDrag: true">
        <a-sphere id="fade-sphere" radius="0.5" material="color: #141c17; shader: flat; side: back; transparent: true; opacity: 0"
                  animation__out="property: material.opacity; from: 0; to: 1; dur: 600; startEvents: fadeOut"
                  animation__in="property: material.opacity; from: 1; to: 0; dur: 600; startEvents: fadeIn">
        </a-sphere>
      </a-camera>
    </a-entity>

    <!-- VIEWPOINT 1: GARDEN BENCH -->
    <a-entity id="bench-spots" class="spot-group" visible="true">
      <a-plane position="0 1.5 -4" rotation="0 0 0" width="2.4" height="0.65" material="shader: flat"
               class="clickable active-ray"
               sign-label="text: Walk to the Garry Oak ->; bgColor: #1f3326; borderColor: #8fb399; textColor: #f4f7f2"
               spot-link="targetSky: #oak-img; targetGroup: #oak-spots; targetAudio: birds-audio; skyRotation: 0 45 0">
      </a-plane>

      <a-entity position="3.1 1.7 -2.5" rotation="0 -50 0">
        <a-plane width="1.75" height="0.48" material="shader: flat"
                 class="clickable active-ray"
                 sign-label="text: [+] Garden Note; bgColor: #3b4d3e; borderColor: #8fb399; textColor: #ffffff; fontSize: 40"
                 info-note="noteId: #bench-note-card">
        </a-plane>
        <a-plane id="bench-note-card" position="0 -0.9 0" visible="false" width="2.7" height="1.2" material="shader: flat"
                 sign-label="text: Winter Dormancy:
Licorice ferns stay bright green
on damp mossy bark all winter.; bgColor: #f7f5ee; borderColor: #3b4d3e; textColor: #222b24; fontSize: 36; width: 1024; height: 455">
        </a-plane>
      </a-entity>
    </a-entity>

    <!-- VIEWPOINT 2: UNDER THE GARRY OAK -->
    <a-entity id="oak-spots" class="spot-group" visible="false">
      <a-plane position="0 1.5 -4" rotation="0 0 0" width="2.4" height="0.65" material="shader: flat"
               class="clickable"
               sign-label="text: <- Return to Bench; bgColor: #1f3326; borderColor: #8fb399; textColor: #f4f7f2"
               spot-link="targetSky: #bench-img; targetGroup: #bench-spots; targetAudio: rain-audio; skyRotation: 0 -90 0">
      </a-plane>
    </a-entity>

  </a-scene>
</body>
</html>
